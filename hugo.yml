module:
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts

params:

  # Hugolify admin
  admin:
    collections:
      projects:
        enable: true
        filter:
          - field: isIndex
            value: false
        icon:
          bootstrap_icons: grid-1x2
          iconoir: layout-left
          lucide: layout-dashboard
          material_icons: space_dashboard
          material_symbols: space_dashboard
        path: "{{year}}/{{slug}}"
        sortable_fields: [date, title]

  # Image
  projects:
    thumbnail:
      desktop: '416x312'
      mobile: '300x225'
      scrollsnap: '240x180'
      sizes: 100vw, 50vw, 33vw

# Default
permalinks:
  page:
    projects: /projects/:year-:slug/
